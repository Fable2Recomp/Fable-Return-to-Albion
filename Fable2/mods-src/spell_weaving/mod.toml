name = "Spell Weaving"
version = "0.1.0"
author = "Refii"
description = "Fable 3's spell weaving in Fable 2: a second spell, the partner, is cast together with the one on the charged slot, at the same power and at the same target. One cast at the charged power by default, as Fable 3 paces it, instead of Fable 2's cascade through every lower slot. Each spell slot has its own partner: on the quick wheel or the spell page of the abilities book, highlight a will and press X to make it the slot's partner, Y to remove it. Spell Weaving itself is learned on the Hybrid page of the abilities book, paid half in Will and half in Skill experience; level N weaves casts up to power N. Slow Time and Raise Dead are never partners."
