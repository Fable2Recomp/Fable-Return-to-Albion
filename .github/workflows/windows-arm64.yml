# Windows ARM64: one workflow per platform, so each has its own status badge and its own history.
# The steps are shared (reusable-build-windows.yml, reusable-publish.yml); releases.yml says when
# a build publishes.
#
#   pull request        build, keep the zip as a run artifact
#   tag beta-N or vN    build, then add the package to the tag's draft release
#   manual run          build, and replace this platform's nightly package unless "publish" is
#                       unticked. The nightly itself starts every platform this way.
name: Windows ARM64

on:
  pull_request:
    branches: [main]
  push:
    tags: ['beta-*', 'v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build as this platform's nightly dev build
        type: boolean
        default: true

# A newer push to the same pull request or branch replaces the run in progress. Tag builds are
# never cancelled.
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      arch: arm64
      runner: windows-11-arm
      preset: win-arm64-release-netplay
      msvc: arm64
      # Clang 22 here: this image carries Visual Studio 18, whose standard library refuses
      # anything older (STL1000 "expected Clang 22 or newer").
      llvm_tag: llvmorg-22.1.8
      llvm: LLVM-22.1.8-woa64.exe
      artifact: windows-arm64

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      artifact: windows-arm64
