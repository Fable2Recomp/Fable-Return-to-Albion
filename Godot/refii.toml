# D3D12 render-target dump path.
render_target_path_d3d12 = ""
# Use D3D12 tiled shared memory.
d3d12_tiled_shared_memory = true

# Lua

# Textures
# The remaster switch: modernized textures and materials, or the game exactly as it shipped. Off restores the original look — no upscaling, no occlusion, no metallic, no parallax. Everything below follows this unless set explicitly.
materials_modernized = true
# Enhance textures at runtime. Off keeps the original assets exactly as shipped. Follows materials_modernized unless set.
texture_upscaling_enabled = true
# Which upscaler to use: 'resample' is the built-in classical filter, 'realesrgan' the neural one (falls back to resample if unavailable).
texture_upscaling_model = "resample"
# Textures enhanced at once; 0 picks half the CPU cores. Clamped to 1-4 — measured to stop scaling past four.
texture_upscaling_workers = 0
# Base name of the neural weights beside the build (.param/.bin). The scale is read from this name.
texture_upscaling_weights = "realesr-general-x4v3"
# Modernized materials: occlusion, roughness, metallic and height packed into one ORM texture, all four derived from the shipped maps. Off falls back to the original specular-only shading. Follows materials_modernized unless set. Applies at the next level load, not immediately.
texture_orm_enabled = true
# How strongly cavity occlusion derived from the normal map fills the ORM's red channel. 0 disables it; the original game applies no occlusion at all.
texture_orm_ao_strength_percent = 50
# How strongly a metallic channel is derived from the specular map's colour, which is a Fresnel term in all but name — bright and coloured is metal, grey and dim is not. 0 disables it. About a fifth of the game's specular maps describe metal; the rest are untouched whatever this says. Needs texture_orm_enabled.
texture_orm_metallic_strength_percent = 100
# Solve a height field from the normal map into the ORM's alpha channel, so surfaces can take parallax. 89.8% of materials have a normal map to derive it from. Off buys back half the ORM's bytes — a varying alpha forces a larger block format. Needs texture_orm_enabled.
texture_orm_height_enabled = true
# Keep decoded and enhanced textures on disk so the work happens once per asset.
texture_cache_enabled = true
# Disk the texture cache may hold; 0 picks 4 GB, or 12 GB with upscaling on. The oldest entries are evicted above it.
texture_cache_max_mb = 0
# Draw the pub games (Keystone and friends) as vector geometry, so their artwork is sharp at any window size. Off falls back to drawing it into bitmaps at the size it was authored at, which is softer, slower and uses more memory.
pubgame_vector_shapes = true
# How sharply the pub games (Keystone and friends) draw their Flash artwork. 100 is the size it was authored at; 0 follows the window. Higher is sharper but slower to load — Keystone measures 4.6 s and 109 MB at 100, and 11.9 s and 348 MB at 250, because the artwork is drawn on the CPU. Ignored unless pubgame_vector_shapes is off.
pubgame_raster_scale_percent = 100
# Whether a pub game frees its Flash timelines the moment the board closes, instead of when the garbage collector gets to them. Unset means on for Android, where a Keystone board's timelines otherwise outlived it, and off on the desktop.
# pubgame_release_on_close = true

# Atlas resolution for pre-baked static fixture shadow maps (2048, 4096, 8192). Changing this triggers a re-bake during the startup warmup screen.
static_shadow_resolution = 8192

