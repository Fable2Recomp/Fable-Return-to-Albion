# Runtime config generated by the launcher.
# Values are written explicitly for the active runtime backend.


# Log
# Logging level.
log_level = "info"
# Log file path; empty uses automatic logs.
log_file = ""
# Enable verbose trace logging.
log_verbose = false
# Enable noisy high-frequency logs.
log_noisy = false
# Periodic log flush interval in seconds.
log_flush_interval = 1
# Maximum log file size before rotation.
log_max_file_size_mb = 5
# Maximum rotated log files to keep.
log_max_files = 20

# Runtime
# Override game data path.
game_data_root = "/home/loreaxe/Fable 2/refii-clean/refii/Godot/assets"
# Override user data path.
user_data_root = "/home/loreaxe/Fable 2/refii-clean/refii/Godot/assets/save"
# Override update data path.
update_data_root = ""
# Override shader cache path.
cache_path = ""

# Lua
# Log script source paths at load time.
lua_trace_script_loads = false

# VFS
# VFS backend: refii for loose asset overrides, native for the original Fable 2 VFS.

# Renderer

# Effects
# Draw the particle effects the GUEST starts at runtime - spell casts, combat impacts, a fire catching. Off leaves only the effects the level itself states.
fx_live_effects = true
# Log a periodic census of the guest's live effects: how many resolve in the particle bank and how many do not.
fx_live_report = false

# Renderer/Debug

# UI/Window
# Initial window width; 0 means default.
window_width = 0
# Initial window height; 0 means default.
window_height = 0
# Start in fullscreen mode.
fullscreen = false
# Monitor index for fullscreen.
monitor = 0

# UI/Presenter
# Allow presentation from non-UI threads.
host_present_from_non_ui_thread = true
# Preserve aspect ratio with letterboxing.
present_letterbox = true
# Horizontal safe-area percentage.
present_safe_area_x = 90
# Vertical safe-area percentage.
present_safe_area_y = 90
# Guest output scaling effect.
present_effect = "bilinear"
# Enable present dithering.
present_dither = false
# Allow overscan cutoff.
present_allow_overscan_cutoff = false
# Clear the present render pass.
present_render_pass_clear = true

# GPU
# Resolution preset override. Use 'custom' to control video_mode_* manually.
resolution = ""
# Guest video mode width.
video_mode_width = 1280
# Guest video mode height.
video_mode_height = 720
# Guest video mode refresh rate.
video_mode_refresh_rate = 60.0
# Enable vertical sync.
vsync = true
# Compile shaders asynchronously.
async_shader_compilation = true
# Store compiled shaders in cache.
store_shaders = true
# Swap post effect.
swap_post_effect = "none"
# Clear memory page state on startup.
clear_memory_page_state = true
# Enable host occlusion query handling.
occlusion_query_enable = true
# Readback resolve mode.
readback_resolve = "none"
# Apply half-pixel offset to readback resolves.
readback_resolve_half_pixel_offset = false
# Enable memexport readback.
readback_memexport = true
# Use fast memexport readback.
readback_memexport_fast = true
# Fake sample count for occlusion queries.
query_occlusion_fake_sample_count = 1000
# Enable half-pixel offset.
half_pixel_offset = true
# Enable native 2x MSAA.
native_2x_msaa = true
# Round float24 depth values.
depth_float24_round = false
# Convert float24 depth in pixel shader.
depth_float24_convert_in_pixel_shader = false
# Use not-equal depth transfer test.
depth_transfer_not_equal_test = true
# Treat gamma render targets as UNORM16.
gamma_render_target_as_unorm16 = true
# Directory to dump shaders to.
dump_shaders = ""
# Use fuzzy alpha epsilon comparisons.
use_fuzzy_alpha_epsilon = false
# Enable GPU debug markers.
gpu_debug_markers = false
# Allow invalid fetch constants.
gpu_allow_invalid_fetch_constants = false

# GPU/Shader
# Scale texture offsets for draw resolution.
draw_resolution_scaled_texture_offsets = true
# Use switch statements in DXBC.
dxbc_switch = true
# Generate DXBC source maps.
dxbc_source_map = false

# GPU
# Render-to-texture memory limit.
texture_cache_memory_limit_render_to_texture = 24
# Soft texture cache memory limit.
texture_cache_memory_limit_soft = 384
# Hard texture cache memory limit.
texture_cache_memory_limit_hard = 768
# Soft texture cache lifetime.
texture_cache_memory_limit_soft_lifetime = 30
# Allow 3D-to-2D texture handling.
gpu_3d_to_2d_texture = true
# Anisotropic filtering override.
anisotropic_override = 3
# Draw resolution scale X.
draw_resolution_scale_x = 1
# Draw resolution scale Y.
draw_resolution_scale_y = 1
# Shared draw resolution scale.
resolution_scale = 1
# Use L2 block for pre-mask resolves.
pre_mask_resolve_l2_block = true
# Fill half-pixel offset during scaled resolves.
resolve_resolution_scale_fill_half_pixel_offset = true
# Execute unclipped draw vertex shader on CPU.
execute_unclipped_draw_vs_on_cpu = false
# Use scissor with CPU unclipped draw VS.
execute_unclipped_draw_vs_on_cpu_with_scissor = false
# Use CPU unclipped draw VS for PSI render backend.
execute_unclipped_draw_vs_on_cpu_for_psi_render_backend = true
# Convert line loops to strips.
force_convert_line_loops_to_strips = false
# Convert quad lists to triangle lists.
force_convert_quad_lists_to_triangle_lists = false
# Convert triangle fans to lists.
