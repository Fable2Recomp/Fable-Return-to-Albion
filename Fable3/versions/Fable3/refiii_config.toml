# EMPTY ON PURPOSE. The generator finds the functions itself from the imports, .pdata and its
# scan; this file only corrects what that gets wrong (a size where the code inside ends on a
# branch, a fragment .pdata omits) and names functions hooks bind to. Every entry is read from
# the Fable 3 IDB (default.xex.i64 under Fable 3/disc), never carried over from Fable 2 by
# address: the two executables share no addresses.
