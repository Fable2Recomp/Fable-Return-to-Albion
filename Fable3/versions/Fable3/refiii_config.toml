# SWITCH TABLES THE GENERATOR SIZES WRONG. Its bounds scan walks back from the bctr to the first
# cmplwi on the index register, across conditional branches.
#
# 0x82D6ECE0, in the texture transcoder sub_82D6E9C8: a 13-entry table (jpt_82D6ECE0) on the
# transcode format r18, bounded only by `cmplwi cr6,r18,0xC` at 0x82D6EBF8 ahead of the FIRST
# switch on r18. The scan met a case compare inside that first switch instead and emitted
# cases 0..2, so format 12 (the Texture Streamer's first texture after the logos) trapped.
# Targets from the table at 0x82D6ECE4: 0 and 12 an 8-byte step, 1-2 and 3 a 16-byte step,
# 4-11 the per-channel path.
[[switch_tables]]
address = 0x82D6ECE0
register = 18
labels = [
  0x82D6ED18, 0x82D6ED24, 0x82D6ED24, 0x82D6ED3C, 0x82D6F01C, 0x82D6F01C, 0x82D6F01C,
  0x82D6F01C, 0x82D6F01C, 0x82D6F01C, 0x82D6F01C, 0x82D6F01C, 0x82D6ED18,
]
