description = "Committed, stamina-driven combat in the style of Elden Ring: enemies take turns and pace their swings, LT toggles the lock-on, swings, rolls and blocks spend stamina, spells spend mana, and a Stamina ability joins Strength. Refii's worked example of a hard mod."
